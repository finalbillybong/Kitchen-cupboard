plugins {
    id "com.android.application"
}

android {
    namespace "com.finalbillybong.kitchencupboard"
    compileSdk 35

    defaultConfig {
        applicationId "com.finalbillybong.kitchencupboard"
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 3
        versionName "1.1.0"
    }

    def updateKeystore = System.getenv("KC_ANDROID_KEYSTORE")
    if (updateKeystore) {
        ["KC_ANDROID_KEY_ALIAS", "KC_ANDROID_STORE_PASSWORD", "KC_ANDROID_KEY_PASSWORD"].each { variable ->
            if (!System.getenv(variable)) throw new GradleException("Missing signing setting: " + variable)
        }
        signingConfigs {
            existingInstall {
                storeFile file(updateKeystore)
                storePassword System.getenv("KC_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("KC_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("KC_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (updateKeystore) signingConfig signingConfigs.existingInstall
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.6.1"
}
